<!DOCTYPE html>
<html lang="ko" data-office-frame-pending>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리사무소 직원 로그인 · 만물인테리어</title>
  <meta name="description" content="관리사무소 직원과 동대표, 입주민을 위한 권한별 로그인 화면입니다." />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#103b4d" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-src 'none'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <script src="js/office-frame-guard.js?v=20260901-office-rbac2"></script>
  <link rel="stylesheet" href="css/styles.css?v=20260901-office-rbac1" />
  <link rel="stylesheet" href="css/brand-system.css?v=20260901-office-rbac1" />
  <link rel="stylesheet" href="css/office-portal.css?v=20260901-office-ops1" />
</head>
<body class="portal-page portal-login-page">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="만물인테리어 홈"><span class="logo-mark">萬</span><span class="logo-text"><strong>만물인테리어</strong><em>관리사무소 협력 포털</em></span></a>
      <a href="office.html" class="btn btn-ghost btn-sm">관리사무소 안내</a>
    </div>
  </header>
  <main class="portal-main">
    <section class="portal-auth-card" aria-labelledby="portalLoginTitle">
      <span class="portal-eyebrow">관리사무소 계정 전용</span>
      <h1 id="portalLoginTitle">이메일로 안전하게 로그인</h1>
      <p class="portal-lead">관리사무소 코드와 등록된 이메일을 확인한 뒤 6자리 인증번호를 보내드립니다. 직책과 열람 범위는 관리자가 설정한 권한을 따릅니다.</p>
      <div id="portalConfigNotice" class="portal-notice" role="status" aria-live="polite">서버 연결 상태를 확인하고 있습니다.</div>

      <form id="portalCodeRequestForm" class="portal-form" novalidate>
        <label for="portalOfficeCode">관리사무소 코드
          <input id="portalOfficeCode" name="officeCode" maxlength="64" autocomplete="organization" autocapitalize="none" spellcheck="false" placeholder="예: sample-apt" />
        </label>
        <label for="portalEmail">등록 이메일
          <input id="portalEmail" name="email" type="email" maxlength="254" autocomplete="username" inputmode="email" />
        </label>
        <p id="portalRequestError" class="portal-error" role="alert" aria-live="polite"></p>
        <button id="portalRequestCode" class="portal-button portal-button-primary" type="submit">이메일 인증번호 받기</button>
      </form>

      <form id="portalCodeVerifyForm" class="portal-form portal-verify" hidden novalidate>
        <p id="portalCodeDestination" class="portal-code-destination"></p>
        <label for="portalCode">6자리 인증번호
          <input id="portalCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" />
        </label>
        <p class="portal-help">인증번호는 이 브라우저에 저장하지 않습니다.</p>
        <p id="portalVerifyError" class="portal-error" role="alert" aria-live="polite"></p>
        <div class="portal-actions">
          <button id="portalVerifyCode" class="portal-button portal-button-primary" type="submit">로그인</button>
          <button id="portalChangeAccount" class="portal-button portal-button-secondary" type="button">이메일 다시 입력</button>
        </div>
      </form>

      <aside class="portal-legacy" aria-labelledby="portalLegacyTitle">
        <h2 id="portalLegacyTitle">기존 6자리 PIN 접수</h2>
        <p>기존 단지 전용 PIN을 사용 중인 관리사무소는 이전 접수 포털을 계속 이용할 수 있습니다.</p>
        <a class="portal-button portal-button-secondary" href="office-request.html">기존 접수 포털 열기</a>
      </aside>
      <p class="portal-support">계정 등록과 권한 확인은 <a href="tel:01023978629">010-2397-8629</a>로 문의해 주세요.</p>
    </section>
  </main>
  <script src="js/office-portal-core.js?v=20260901-office-ops1"></script>
  <script src="js/office-portal-api.js?v=20260901-office-ops1"></script>
  <script src="js/office-login.js?v=20260901-office-rbac2"></script>
</body>
</html>
