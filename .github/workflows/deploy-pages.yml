name: Deploy to GitHub Pages

# 공개 사이트는 main 에서만 배포된다.
# 예전에는 작업 브랜치도 트리거에 있었지만, github-pages 환경이 배포 가능한 브랜치를 제한하고 있어
# 러너가 배정되기도 전에 2초 만에 거부됐다 — 2026-07-26~27 에 12번 연속 빨간불(main 은 같은 워크플로로 매번 성공).
# 성공할 수 없는 트리거를 두면 빨간불이 일상이 되고, 진짜 고장을 놓치게 된다.
# 작업 브랜치 내용을 실제로 보려면 main 에 병합해야 한다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행 (진행 중 배포는 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify generated blog is current
        shell: bash
        run: |
          git ls-files --error-unmatch data/leak-case-index.json
          python3 scripts/prerender-posts.py
          git diff --exit-code -- blog.html posts rss.xml data/leak-case-index.json

      - name: Install browser test runtime
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/manmool-e2e" --no-save --package-lock=false playwright@1.55.0
          "$RUNNER_TEMP/manmool-e2e/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify lead privacy
        env:
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: >-
          node --test --test-concurrency=1
          tests/lead-transport.test.cjs
          tests/lead-inbox-pure.test.cjs
          tests/lead-inbox-transport.test.cjs
          tests/lead-inbox-server.test.cjs
          tests/lead-inbox.e2e.cjs
          tests/lead-privacy.e2e.cjs
          tests/inquiry-phone.e2e.cjs
          tests/inquiry-result-honesty.e2e.cjs
          tests/inquiry-usability.e2e.cjs
          tests/inquiry-receipt.e2e.cjs
          tests/revenue-metadata.test.cjs
          tests/revenue-conversion.e2e.cjs

      - name: Run management office artifact mutation tests
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/configure-office-api.test.cjs tests/configure-office-portal-api.test.cjs tests/pages-artifact-policy.test.cjs

      - name: Run management office portal regression
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/office-request.logic.test.cjs tests/office-request-api.test.cjs tests/office-request-auth.e2e.cjs tests/office-request-workflow.e2e.cjs tests/office-request-recent-changes.e2e.cjs tests/office-request-resident-focus.e2e.cjs tests/office-intake.e2e.cjs tests/office-portal-core.test.cjs tests/office-portal-api.test.cjs tests/office-portal-rbac.e2e.cjs

      - name: Run source quality checks
        shell: bash
        env:
          CI: "true"
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: |
          set -euo pipefail
          for check in scripts/ensure-*.mjs; do
            if [ "$(basename "$check")" = "ensure-pages-artifact.mjs" ]; then
              continue
            fi
            node "$check"
          done
          python3 -m unittest tests/test_prerender_posts.py
          node --test tests/unified-brand-design.e2e.cjs
          node --test scripts/new-case-post.test.mjs
          node --test apps-script-contract/test/*.mjs
          git diff --exit-code

      - name: Enable management office employee portal for production artifact
        run: >-
          node scripts/configure-office-portal-api.mjs
          --url https://script.google.com/macros/s/AKfycbwnlDRquyFw2T6JS3D0thRpnFW_u7ZbL3Pn3twtidhkgkr-QWKqrI3gZH9VCgY0Z-sR/exec
          --enable

      - name: Build public allowlist artifact
        run: node scripts/build-pages-artifact.mjs

      - name: Verify public artifact
        run: node scripts/ensure-pages-artifact.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 고객 화면에 필요한 허용목록만 공개한다. 서버 소스·테스트·문서는 제외.
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
