name: Deploy to GitHub Pages

# 공개 사이트는 main 에서만 배포된다.
# 예전에는 작업 브랜치도 트리거에 있었지만, github-pages 환경이 배포 가능한 브랜치를 제한하고 있어
# 러너가 배정되기도 전에 2초 만에 거부됐다 — 2026-07-26~27 에 12번 연속 빨간불(main 은 같은 워크플로로 매번 성공).
# 성공할 수 없는 트리거를 두면 빨간불이 일상이 되고, 진짜 고장을 놓치게 된다.
# 작업 브랜치 내용을 실제로 보려면 main 에 병합해야 한다.
#
# 2026-11-19: main 으로 가는 PR 에서도 같은 검사(verify job)를 돈다. verify 는 github-pages 환경을 쓰지 않으므로
# 위의 '환경이 작업 브랜치를 거부' 문제가 없다. 배포(deploy job)는 main 의 push·수동 실행에서만 한다.
# 예전에는 e2e 가 병합한 뒤 main 에서 처음 돌아, 하나라도 깨지면 main 이 빨간불이 되고 뒤따르는 사례 PR 배포가 모두 막혔다
# (PR #238 병합 뒤 e2e 9건이 main 에서 처음 깨졌다).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 기본은 읽기만. Pages 쓰기·OIDC 토큰은 deploy job 에만 준다(PR 검사에는 쓰기 권한이 없다).
permissions:
  contents: read

# 'pages' 묶음은 배포하는 실행(main 의 push·수동 실행 — deploy job 과 같은 조건)만 쓴다. 동시에 하나만, 진행 중 배포는 취소하지 않는다.
# 그 밖의 실행(PR 검사·작업 브랜치 수동 실행, 둘 다 verify 만 돈다)은 PR·브랜치마다 따로 묶고, 새 실행이 오면 이전 것을 취소한다.
# GitHub 은 한 묶음에 대기 실행을 하나만 두고 새로 들어온 실행이 예전 대기 실행을 취소하므로, 검사 실행이 'pages' 에 들어가면
# 대기 중인 main 배포를 밀어내 main 의 최신 커밋이 다음 push 까지 배포되지 않을 수 있다(2026-11-19 리뷰).
concurrency:
  group: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'pages' || format('pages-check-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !(github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}

jobs:
  verify:
    # 2026-11-17: ubuntu-latest 가 ubuntu-26.04 로 바뀐 뒤 index.html 1280px 의 '상담' 버튼이 41px 로 그려져
    # service-design 의 44px 검사에서 배포가 멈췄다(run 44069722749 — 사이트·검사 변경 없음, 글꼴 차이).
    # 마지막 성공 배포(11/12)와 같은 24.04 로 고정한다. 26.04 로 올리려면 그 버튼 최소 너비부터 고친다.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # 2026-11-19: e2e 가 저장소 config.json 의 라이브 접수함으로 시험 문의를 보냈다(대표 시트에 시험 행 16개).
      # 이제 모든 브라우저 검사는 tests/helpers/e2e-offline.cjs 를 먼저 불러 접수함·메일 접수 서버와 끊긴다.
      # 그 배선(helper 선로딩·route.continue 금지·두 보호)을 첫 e2e 보다 먼저 확인한다. 아래 ensure 반복에서도 한 번 더 돈다.
      - name: Verify browser tests stay offline
        run: |
          node scripts/ensure-e2e-offline.mjs
          node --test tests/e2e-offline.test.cjs

      - name: Verify generated blog is current
        shell: bash
        run: |
          git ls-files --error-unmatch data/leak-case-index.json
          python3 scripts/prerender-posts.py
          # 2026-11-25: leak.html 의 누수 후기 칸(leak-reviews 표시 사이)과 area/(대전 구별 현장 기록 쪽)도 생성물이다.
          # area/ 는 새 쪽이 생기면 추적되지 않은 파일로 남으므로 git status 로도 본다.
          git diff --exit-code -- blog.html posts rss.xml data/leak-case-index.json leak.html area
          test -z "$(git status --porcelain -- area posts)"

      - name: Verify generated designs are current
        shell: bash
        run: |
          python3 scripts/prerender-designs.py
          git diff --exit-code -- designs

      # 브라우저 바이너리(약 150MB)를 매 배포마다 새로 받지 않도록 캐시한다 — 키는 고정한 playwright 버전
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install browser test runtime
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/manmool-e2e" --no-save --package-lock=false playwright@1.55.0
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            "$RUNNER_TEMP/manmool-e2e/node_modules/.bin/playwright" install-deps chromium
          else
            "$RUNNER_TEMP/manmool-e2e/node_modules/.bin/playwright" install --with-deps chromium
          fi

      - name: Verify lead privacy
        env:
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: >-
          node --test --test-concurrency=1
          tests/lead-transport.test.cjs
          tests/lead-inbox-pure.test.cjs
          tests/lead-inbox-transport.test.cjs
          tests/lead-inbox-server.test.cjs
          tests/lead-inbox.e2e.cjs
          tests/lead-privacy.e2e.cjs
          tests/inquiry-phone.e2e.cjs
          tests/inquiry-result-honesty.e2e.cjs
          tests/inquiry-usability.e2e.cjs
          tests/inquiry-receipt.e2e.cjs
          tests/revenue-metadata.test.cjs
          tests/lead-source-persist.test.cjs
          tests/revenue-conversion.e2e.cjs
          tests/hero-kakao.e2e.cjs
          tests/leak-kakao.e2e.cjs

      - name: Run management office artifact mutation tests
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/configure-office-api.test.cjs tests/configure-office-portal-api.test.cjs tests/pages-artifact-policy.test.cjs

      - name: Run management office portal regression
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/office-request.logic.test.cjs tests/office-request-api.test.cjs tests/office-request-auth.e2e.cjs tests/office-request-workflow.e2e.cjs tests/office-request-recent-changes.e2e.cjs tests/office-request-resident-focus.e2e.cjs tests/office-intake.e2e.cjs tests/office-portal-core.test.cjs tests/office-portal-api.test.cjs tests/office-portal-rbac.e2e.cjs

      - name: Run source quality checks
        shell: bash
        env:
          CI: "true"
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: |
          set -euo pipefail
          for check in scripts/ensure-*.mjs; do
            if [ "$(basename "$check")" = "ensure-pages-artifact.mjs" ]; then
              continue
            fi
            node "$check"
          done
          python3 -m unittest tests/test_prerender_posts.py
          node --test tests/unified-brand-design.e2e.cjs
          node --test tests/case-finder.e2e.cjs
          node --test tests/case-story.e2e.cjs
          node --test tests/buyeo-balcony-case.test.cjs
          node --test tests/quote-contract-guide.test.cjs
          node --test tests/chungmu-cases.test.cjs
          node --test tests/aluminum-screen-case.test.cjs tests/aluminum-screen-case.e2e.cjs
          node --test tests/water-outlet-case.test.cjs tests/water-outlet-case.e2e.cjs
          node --test tests/recent-cases-20261013.test.cjs tests/recent-cases-20261013.e2e.cjs
          node --test tests/recent-cases-20261031.test.cjs tests/recent-cases-20261031.e2e.cjs
          node --test tests/winter-freeze-guide-20261028.test.cjs tests/winter-freeze-guide-20261028.e2e.cjs
          node --test tests/recent-cases-20261103.test.cjs tests/recent-cases-20261103.e2e.cjs
          node --test tests/recent-cases-20261104.test.cjs tests/recent-cases-20261104.e2e.cjs
          node --test tests/recent-cases-20261112.test.cjs
          node --test tests/recent-cases-20261113.test.cjs
          node --test tests/recent-cases-20261117.test.cjs
          node --test tests/recent-cases-20261118.test.cjs
          node --test tests/recent-cases-20261118-taesan.test.cjs
          node --test tests/recent-cases-20261121.test.cjs
          node --test tests/case-reader.e2e.cjs
          node --test tests/remaining-cases.test.cjs
          node --test scripts/new-case-post.test.mjs
          node --test scripts/new-review.test.mjs
          node --test tests/review-render.test.cjs
          node --test tests/leak-fee-range.e2e.cjs tests/review-intake.e2e.cjs
          node --test apps-script-contract/test/*.mjs
          git diff --exit-code

      # 2026-11-19: 예전에는 여기서 configure-office-portal-api.mjs --enable 로 포털 주소를 배포 때만 주입했다
      # (저장소 office-portal-api.json 은 꺼짐, 라이브는 켜짐 — 두 값이 달라 헷갈렸다). 이제 저장소 파일이 라이브와 같은 값을
      # 그대로 들고 있고 주입 단계는 없다. 주소를 바꾸려면 그 스크립트로 저장소 파일을 고쳐 PR 로 올린다.
      # ensure-office-portal.mjs 가 이 단계가 다시 생기지 않게 지킨다.

      - name: Build public allowlist artifact
        run: node scripts/build-pages-artifact.mjs

      - name: Verify public artifact
        run: node scripts/ensure-pages-artifact.mjs

      - name: Verify service navigation and responsive layouts
        env:
          CI: "true"
          NODE_PATH: ${{ runner.temp }}/manmool-e2e/node_modules
        run: node --test tests/service-design.e2e.cjs tests/page-recovery.e2e.cjs tests/site-polish.e2e.cjs

      - name: Upload site artifact
        # PR 검사·작업 브랜치 수동 실행은 여기까지 — 산출물은 main 을 배포할 때만 올린다(deploy job 과 같은 조건).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          # 고객 화면에 필요한 허용목록만 공개한다. 서버 소스·테스트·문서는 제외.
          path: "_site"

  deploy:
    # verify 가 모두 통과한 main 산출물만 공개한다. PR·작업 브랜치 수동 실행은 verify 만 돈다.
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
