name: Deploy to GitHub Pages

# 공개 사이트는 main 에서만 배포된다.
# 예전에는 작업 브랜치도 트리거에 있었지만, github-pages 환경이 배포 가능한 브랜치를 제한하고 있어
# 러너가 배정되기도 전에 2초 만에 거부됐다 — 2026-07-26~27 에 12번 연속 빨간불(main 은 같은 워크플로로 매번 성공).
# 성공할 수 없는 트리거를 두면 빨간불이 일상이 되고, 진짜 고장을 놓치게 된다.
# 작업 브랜치 내용을 실제로 보려면 main 에 병합해야 한다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 진행 (진행 중 배포는 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 정적 사이트이므로 저장소 루트를 그대로 업로드
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
