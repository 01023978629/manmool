name: Contract Backend (Fly.io retired)

# Fly.io 계정과 manmool-contract 앱은 2026-07-30에 종료했다.
# contract-backend 변경 시 더 이상 자동 배포하지 않는다.
# 이 워크플로는 과거 배포 버튼을 눌렀을 때 현재 상태를 분명히 알리는
# 수동 확인용으로만 남긴다.

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Show current contract deployment status
        run: |
          echo "Fly.io 전자계약 배포는 2026-07-30에 종료되었습니다."
          echo "contract-backend는 참고·마이그레이션용 소스로만 보존됩니다."
          echo "새 전자계약은 Google Apps Script + Sheets + Drive 구조로 이전 준비 중입니다."
